name: Build RPi RCM Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Check hourly for updates

permissions:
  contents: write

jobs:
  check_and_build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check latest releases
        id: check
        run: |
          HEKATE_LATEST=$(curl -s https://api.github.com/repos/CTCaer/hekate/releases/latest | jq -r .tag_name)
          FUSEE_LATEST=$(git ls-remote https://github.com/DefenderOfHyrule/fusee-nano.git HEAD | awk '{print substr($1,1,7)}')
          TAG_NAME="${HEKATE_LATEST}-${FUSEE_LATEST}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "HEKATE_LATEST=$HEKATE_LATEST" >> $GITHUB_ENV
          
          if env GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} gh release view "$TAG_NAME" -R ${{ github.repository }} &>/dev/null; then
            echo "Release $TAG_NAME already exists. Skipping build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Build fusee-nano
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential xxd jq curl wget
          git clone https://github.com/DefenderOfHyrule/fusee-nano.git fusee-nano-src
          cd fusee-nano-src
          make
          cp fusee-nano ../
          cd ..

      - name: Download latest Hekate payload
        if: steps.check.outputs.skip == 'false'
        run: |
          HEKATE_URL=$(curl -s https://api.github.com/repos/CTCaer/hekate/releases/latest | jq -r '.assets[] | select(.name | test("^hekate_ctcaer_[0-9.]+\\.bin$")) | .browser_download_url')
          wget -O payload.bin $HEKATE_URL

      - name: Prepare rpi-image-gen
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone https://github.com/raspberrypi/rpi-image-gen.git
          cd rpi-image-gen
          sudo ./install_deps.sh

      - name: Build custom image
        if: steps.check.outputs.skip == 'false'
        run: |
          export PROJECT_ROOT=$(pwd)
          # Inject absolute path into the layer hook
          sed -i "s|PROJECT_ROOT_PLACEHOLDER|$PROJECT_ROOT|g" layer/rcm-injector.yaml
          
          cd rpi-image-gen
          # Execute the build, sourcing layers and config from the parent directory
          ./rpi-image-gen build -S ../ -c ../config/rcm-image.yaml
          
      - name: Compress image
        if: steps.check.outputs.skip == 'false'
        run: |
          # Compress the raw image using xz with all CPU threads to drastically reduce file size
          xz -z -T0 rpi-image-gen/work/image-rpi-rcm-injector/rpi-rcm-injector.img

      - name: Create Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "RPiRCM - Hekate ${{ env.HEKATE_LATEST }}"
          files: |
            rpi-image-gen/work/**/*.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
